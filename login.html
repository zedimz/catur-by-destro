<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess - Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --gold: #ffd700;
    --gold-dark: #b8860b;
    --bg-dark: #0a0a1a;
    --panel: rgba(20, 20, 40, 0.85);
    --border: rgba(255, 215, 0, 0.25);
  }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Segoe UI', sans-serif;
    background: #0a0a1a;
    /* PERBAIKAN: Biar bisa discroll kalau layar kekecilan */
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    padding: 20px;
  }

  /* Background dibuat fixed biar gak ikut geser */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(45deg, #12122a 25%, transparent 25%),
      linear-gradient(-45deg, #12122a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #12122a 75%),
      linear-gradient(-45deg, transparent 75%, #12122a 75%);
    background-size: 70px 70px;
    background-position: 0 0, 0 35px, 35px -35px, -35px 0px;
    opacity: 0.5;
    animation: bgMove 40s linear infinite;
    z-index: -2;
    pointer-events: none;
  }

  @keyframes bgMove {
    from { background-position: 0 0, 0 35px, 35px -35px, -35px 0px; }
    to { background-position: 70px 70px, 70px 105px, 105px 35px, 35px 70px; }
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
    z-index: -1;
  }
  .orb-1 { width: 400px; height: 400px; background: #ffd700; top: -120px; left: -100px; animation: float 12s ease-in-out infinite; }
  .orb-2 { width: 350px; height: 350px; background: #6a00ff; bottom: -100px; right: -80px; animation: float 15s ease-in-out infinite reverse; }

  @keyframes float {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(40px, 30px); }
  }

  .floating-piece {
    position: fixed;
    font-size: 80px;
    color: rgba(255, 215, 0, 0.06);
    pointer-events: none;
    user-select: none;
    animation: floatPiece 20s ease-in-out infinite;
    z-index: -1;
  }
  .fp-1 { top: 10%; left: 8%; animation-delay: 0s; }
  .fp-2 { top: 60%; left: 15%; animation-delay: -5s; font-size: 60px; }
  .fp-3 { top: 15%; right: 10%; animation-delay: -10s; }
  .fp-4 { bottom: 12%; right: 12%; animation-delay: -3s; font-size: 100px; }

  @keyframes floatPiece {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-30px) rotate(5deg); }
  }

  .login-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    backdrop-filter: blur(16px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.7), 0 0 50px rgba(255, 215, 0, 0.08);
    animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    /* PERBAIKAN: Margin auto biar kalau di-scroll tetap di tengah */
    margin: auto;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-wrap { text-align: center; margin-bottom: 30px; }
  .logo-piece {
    font-size: 56px; line-height: 1; display: inline-block;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
    animation: bouncePiece 3s ease-in-out infinite;
  }

  @keyframes bouncePiece {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }

  .logo-title {
    font-size: 30px; font-weight: 900; letter-spacing: 7px;
    background: linear-gradient(90deg, #ffd700, #fff8dc, #ffd700);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; margin-top: 10px;
  }

  @keyframes shine { to { background-position: 200% center; } }

  .logo-sub { font-size: 11px; letter-spacing: 3px; color: #8888aa; margin-top: 6px; text-transform: uppercase; }

  .tabs {
    display: flex; background: rgba(0,0,0,0.3); border-radius: 12px;
    padding: 5px; margin-bottom: 28px; border: 1px solid rgba(255,255,255,0.05);
  }

  .tab {
    flex: 1; padding: 11px; border: none; background: transparent; color: #8888aa;
    font-size: 13px; font-weight: 700; letter-spacing: 1.5px; border-radius: 9px;
    cursor: pointer; transition: 0.25s; font-family: inherit;
  }

  .tab.active {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a1a; box-shadow: 0 4px 14px rgba(255, 215, 0, 0.4);
  }

  .form-group { margin-bottom: 18px; animation: fieldIn 0.4s ease both; }
  .form-group:nth-child(1) { animation-delay: 0.05s; }
  .form-group:nth-child(2) { animation-delay: 0.1s; }
  .form-group:nth-child(3) { animation-delay: 0.15s; }

  @keyframes fieldIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-label {
    display: block; font-size: 11px; letter-spacing: 1.5px; color: #8888aa;
    font-weight: 600; margin-bottom: 7px; text-transform: uppercase;
  }

  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-icon { position: absolute; left: 15px; font-size: 16px; opacity: 0.6; pointer-events: none; }

  .form-input {
    width: 100%; padding: 14px 16px 14px 44px; background: rgba(0,0,0,0.35);
    border: 1.5px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff;
    font-size: 14px; font-family: inherit; outline: none; transition: 0.25s;
  }

  .form-input::placeholder { color: #55557a; }
  .form-input:focus {
    border-color: var(--gold); background: rgba(0,0,0,0.5);
    box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.12);
  }

  .toggle-pass {
    position: absolute; right: 14px; background: none; border: none; color: #8888aa;
    cursor: pointer; font-size: 16px; padding: 4px; transition: 0.2s; line-height: 1;
  }
  .toggle-pass:hover { color: var(--gold); }

  .strength-bar { display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: 0.3s; }
  .strength-bar.show { opacity: 1; }
  .strength-seg { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); transition: 0.3s; }
  .strength-text { font-size: 10px; letter-spacing: 1px; margin-top: 5px; color: #8888aa; min-height: 12px; }

  .starter-info {
    background: rgba(255, 215, 0, 0.08); border: 1px solid rgba(255, 215, 0, 0.25);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; display: none; animation: fieldIn 0.4s ease;
  }
  .starter-info.show { display: block; }
  .starter-info .title {
    font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 1.5px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .starter-info .items { display: flex; gap: 10px; flex-wrap: wrap; }
  .starter-info .reward {
    display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    color: #fff; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .submit-btn {
    width: 100%; padding: 16px; margin-top: 10px; font-size: 15px; font-weight: 900;
    letter-spacing: 3px; color: #1a1a1a; background: linear-gradient(135deg, #ffd700, #ff8c00);
    border: none; border-radius: 14px; cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
    transition: 0.2s; position: relative; overflow: hidden; font-family: inherit;
  }

  .submit-btn::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: sweep 2.5s ease-in-out infinite;
  }

  @keyframes sweep { 0% { left: -100%; } 60%, 100% { left: 100%; } }
  .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(255, 215, 0, 0.6); }
  .submit-btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: #55557a; font-size: 11px; letter-spacing: 2px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

  .offline-btn {
    width: 100%; padding: 13px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #b0b0d0;
    font-size: 13px; font-weight: 600; letter-spacing: 1.5px; cursor: pointer;
    transition: 0.25s; font-family: inherit;
  }
  .offline-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,215,0,0.3); color: #fff; }

  .error-msg {
    background: rgba(255, 60, 60, 0.12); border: 1px solid rgba(255, 60, 60, 0.3);
    color: #ff7a7a; font-size: 12px; padding: 10px 14px; border-radius: 10px;
    margin-bottom: 16px; display: none; letter-spacing: 0.3px; line-height: 1.5;
  }
  .error-msg.show { display: block; animation: shake 0.4s; }
  .error-msg.success { background: rgba(77, 255, 136, 0.12); border-color: rgba(77, 255, 136, 0.3); color: #4dff88; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .footer-note { text-align: center; font-size: 10px; color: #55557a; letter-spacing: 1px; margin-top: 20px; line-height: 1.5; }
  .footer-note b { color: #8888aa; }

  /* POPUP CUSTOM (KONEKSI TERPUTUS) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
    z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(180deg, #1a1a30, #0f0f20); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 25px 80px rgba(0,0,0,0.8); animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; color: #fff; }
  .modal-text { font-size: 13px; color: #b0b0d0; margin-bottom: 22px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button {
    flex: 1; padding: 13px; border-radius: 12px; border: none; font-weight: 800;
    font-size: 13px; letter-spacing: 1.5px; cursor: pointer; transition: 0.2s; font-family: inherit;
  }
  .btn-cancel { background: rgba(255,255,255,0.08); color: #b0b0d0; }
  .btn-cancel:hover { background: rgba(255,255,255,0.15); }
  .btn-primary { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a1a; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,215,0,0.5); }

  @media (max-width: 420px) {
    body { padding: 12px; }
    .login-card { padding: 30px 22px; border-radius: 20px; }
    .logo-title { font-size: 24px; letter-spacing: 5px; }
    .logo-piece { font-size: 44px; }
    .floating-piece { display: none; }
    .starter-info .items { gap: 6px; }
    .starter-info .reward { padding: 4px 8px; font-size: 10px; }
  }
</style>
</head>
<body>

  <audio id="sfxClick" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="floating-piece fp-1">♞</div>
  <div class="floating-piece fp-2">♜</div>
  <div class="floating-piece fp-3">♝</div>
  <div class="floating-piece fp-4">♛</div>

  <div class="login-card">

    <div class="logo-wrap">
      <div class="logo-piece">♚</div>
      <h1 class="logo-title">CHESS</h1>
      <p class="logo-sub">Enter The Arena</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLogin">MASUK</button>
      <button class="tab" id="tabRegister">DAFTAR</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="starter-info" id="starterInfo">
      <div class="title">🎁 BONUS PENDAFTARAN</div>
      <div class="items">
        <div class="reward"><span class="ico">🪙</span> 100 Koin</div>
        <div class="reward"><span class="ico">⭐</span> Level 1</div>
        <div class="reward"><span class="ico">📊</span> 0 EXP</div>
      </div>
    </div>

    <form id="authForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" class="form-input" id="username" placeholder="Masukkan username..." maxlength="16">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-input" id="password" placeholder="Masukkan password..." maxlength="32">
          <button type="button" class="toggle-pass" id="togglePass">👁️</button>
        </div>
        <div class="strength-bar" id="strengthBar">
          <div class="strength-seg"></div>
          <div class="strength-seg"></div>
          <div class="strength-seg"></div>
          <div class="strength-seg"></div>
        </div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      <div class="form-group" id="confirmGroup" style="display:none;">
        <label class="form-label">Konfirmasi Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-input" id="confirmPass" placeholder="Ulangi password..." maxlength="32">
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">MASUK</button>
    </form>

    <div class="divider">ATAU</div>

    <button class="offline-btn" id="offlineBtn">🎮 MAIN OFFLINE (TAMU)</button>

    <p class="footer-note">
      Dengan masuk, kamu setuju dengan <b>Syarat & Ketentuan</b><br>
      dan <b>Kebijakan Privasi</b> Chess Arena.
    </p>

  </div>

  <!-- POPUP OFFLINE -->
  <div class="modal-overlay" id="offlineModal">
    <div class="modal">
      <div class="modal-icon">📡</div>
      <div class="modal-title">Koneksi Terputus</div>
      <div class="modal-text">Tidak dapat terhubung ke server.<br>Beralih ke Mode Tamu (Offline)?</div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelOffline">TETAP DI SINI</button>
        <button class="btn-primary" id="acceptOffline">MODE TAMU</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://catur-destro.dedisurakhman234.workers.dev/api";

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const submitBtn = document.getElementById('submitBtn');
  const confirmGroup = document.getElementById('confirmGroup');
  const authForm = document.getElementById('authForm');
  const errorMsg = document.getElementById('errorMsg');
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const confirmEl = document.getElementById('confirmPass');
  const togglePass = document.getElementById('togglePass');
  const strengthBar = document.getElementById('strengthBar');
  const strengthText = document.getElementById('strengthText');
  const starterInfo = document.getElementById('starterInfo');
  const offlineBtn = document.getElementById('offlineBtn');
  const sfxClick = document.getElementById('sfxClick');

  let mode = 'login';

  document.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.closest('.tab')) {
      if (sfxClick) { sfxClick.currentTime = 0; sfxClick.play().catch(() => {}); }
    }
  });

  function setMode(newMode) {
    mode = newMode;
    clearError();

    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      submitBtn.textContent = 'MASUK';
      confirmGroup.style.display = 'none';
      strengthBar.classList.remove('show');
      strengthText.textContent = '';
      starterInfo.classList.remove('show');
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      submitBtn.textContent = 'DAFTAR';
      confirmGroup.style.display = 'block';
      starterInfo.classList.add('show');
    }
  }

  tabLogin.addEventListener('click', () => setMode('login'));
  tabRegister.addEventListener('click', () => setMode('register'));

  let passVisible = false;
  togglePass.addEventListener('click', () => {
    passVisible = !passVisible;
    passwordEl.type = passVisible ? 'text' : 'password';
    confirmEl.type = passVisible ? 'text' : 'password';
    togglePass.textContent = passVisible ? '🙈' : '👁️';
  });

  passwordEl.addEventListener('input', () => {
    if (mode !== 'register') return;
    const val = passwordEl.value;
    strengthBar.classList.add('show');
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

    const segs = strengthBar.querySelectorAll('.strength-seg');
    const colors = ['#ff4d4d', '#ff9f40', '#ffd700', '#4dff88'];
    const labels = ['Lemah', 'Cukup', 'Kuat', 'Sangat Kuat'];

    segs.forEach((seg, i) => { seg.style.background = i < score ? colors[score - 1] : 'rgba(255,255,255,0.1)'; });
    strengthText.textContent = val.length ? labels[Math.max(0, score - 1)] : '';
    strengthText.style.color = val.length ? colors[Math.max(0, score - 1)] : '#8888aa';
  });

  function showError(msg) {
    errorMsg.className = 'error-msg show';
    errorMsg.innerHTML = msg;
    errorMsg.style.animation = 'none';
    void errorMsg.offsetWidth;
    errorMsg.style.animation = '';
  }
  function showSuccess(msg) { errorMsg.className = 'error-msg success show'; errorMsg.innerHTML = msg; }
  function clearError() { errorMsg.className = 'error-msg'; errorMsg.textContent = ''; }

  async function fetchWithTimeout(url, options, timeout = 8000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      return res;
    } catch (e) {
      clearTimeout(id);
      throw e;
    }
  }

  function enterGuestMode() {
    sessionStorage.removeItem('chessUser');
    localStorage.removeItem('chessUser');
    localStorage.setItem('chessOfflineMode', 'true');
    localStorage.setItem('chessUser', 'Tamu');

    if (!localStorage.getItem('chessCoins_Tamu')) {
      localStorage.setItem('chessCoins_Tamu', '100');
      localStorage.setItem('chessProfile_Tamu', JSON.stringify({ level: 1, exp: 0, expToNext: 10, lastExpGain: Date.now(), totalCoinsEarned: 0, totalWins: 0, totalGames: 0 }));
      localStorage.setItem('chessOwned_Tamu', JSON.stringify({ boards: ['default'], pieces: ['default'] }));
      localStorage.setItem('chessEquipped_Tamu', JSON.stringify({ board: 'default', pieces: 'default' }));
      localStorage.setItem('chessRank_Tamu', JSON.stringify({ totalStars: 0 }));
      localStorage.setItem('chessStats_Tamu', JSON.stringify({ wins: 0, losses: 0, draws: 0 }));
    }

    window.location.href = 'home.html';
  }

  const offlineModal = document.getElementById('offlineModal');
  document.getElementById('cancelOffline').addEventListener('click', () => offlineModal.classList.remove('show'));
  document.getElementById('acceptOffline').addEventListener('click', enterGuestMode);

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const username = usernameEl.value.trim();
    const password = passwordEl.value;

    if (!username) return showError('❌ Username tidak boleh kosong!');
    if (username.length < 3) return showError('❌ Username minimal 3 karakter!');
    if (!/^[a-zA-Z0-9_]+$/.test(username)) return showError('❌ Username hanya boleh huruf, angka, dan underscore!');
    if (!password) return showError('❌ Password tidak boleh kosong!');
    if (password.length < 6) return showError('❌ Password minimal 6 karakter!');

    submitBtn.disabled = true;
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'MEMPROSES...';

    try {
      if (mode === 'register') {
        if (password !== confirmEl.value) throw new Error('Konfirmasi password tidak cocok!');
        
        const res = await fetchWithTimeout(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal mendaftar');

        showSuccess('🎉 <b>Akun berhasil dibuat!</b><br>🪙 +100 Koin • ⭐ Level 1<br><small>Mengalihkan...</small>');
        setTimeout(() => { setMode('login'); submitBtn.disabled = false; submitBtn.textContent = 'MASUK'; }, 1800);

      } else {
        const res = await fetchWithTimeout(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');

        sessionStorage.setItem('chessUser', data.user.username);
        localStorage.removeItem('chessOfflineMode');

        showSuccess(`✅ <b>Login berhasil!</b><br>Selamat datang, ${data.user.username}!<br><small>Mengalihkan...</small>`);
        setTimeout(() => window.location.href = 'home.html', 1200);
      }
    } catch (err) {
      if (err.name === 'AbortError' || err.message === 'Failed to fetch' || err.message.includes('NetworkError')) {
        offlineModal.classList.add('show');
      } else {
        showError('❌ ' + err.message);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });

  offlineBtn.addEventListener('click', () => {
    offlineModal.classList.add('show');
  });

  usernameEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') passwordEl.focus(); });
  passwordEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') { if (mode === 'register') confirmEl.focus(); else authForm.dispatchEvent(new Event('submit')); }
  });
  confirmEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') authForm.dispatchEvent(new Event('submit')); });

</script>
</body>
</html>
